name: build

# One image per directory under apps/. Each app provides a Dockerfile and a version.sh that prints
# the image tag. PRs build (no push); main pushes ghcr.io/keplersj/<app>:<tag> -- once. Tags are
# immutable: a tag that already exists in GHCR is skipped, so bump version.sh's inputs to release.
on:
  pull_request:
    paths: ["apps/**", ".github/workflows/build.yaml"]
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        run: echo "apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  image:
    needs: apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/keplersj/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: tag
        run: |
          tag=$(apps/${{ matrix.app }}/version.sh)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${tag} already exists; not rebuilding an immutable tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Optional per-app smoke test against a locally loaded amd64 build, before anything is pushed.
      - id: smoke
        if: (steps.tag.outputs.exists != 'true' || github.event_name == 'pull_request') && hashFiles(format('apps/{0}/smoke.sh', matrix.app)) != ''
        run: |
          docker buildx build --platform linux/amd64 --load -t "smoke/${{ matrix.app }}:ci" "apps/${{ matrix.app }}"
          "apps/${{ matrix.app }}/smoke.sh" "smoke/${{ matrix.app }}:ci"
      - id: build
        if: steps.tag.outputs.exists != 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          provenance: true
          sbom: true
      - if: steps.build.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - if: steps.build.outcome == 'success' && github.event_name != 'pull_request'
        run: echo "::notice::pushed ${IMAGE}:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}"
